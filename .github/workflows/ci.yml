name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancelar runs anteriores en la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'
  POSTGRES_VERSION: '16'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # BACKEND TESTS (Laravel + PostgreSQL 16 + Redis)
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: 🔧 Backend Tests (Laravel)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_restaurant_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: |
          cp .env.example .env || true
          cat >> .env << 'ENVEOF'
          APP_ENV=testing
          APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGluZ3B1cnBvc2VzMTIzNDU2Nzg5MA==
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=pos_restaurant_test
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          ENVEOF

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Run backend tests
        run: php artisan test --no-interaction
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pos_restaurant_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND TESTS (Vitest) + TYPECHECK
  # ═══════════════════════════════════════════════════════════════
  frontend-tests:
    name: 🎨 Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test -- --run

  # ═══════════════════════════════════════════════════════════════
  # BUILD VERIFICATION (Tauri + Vite)
  # ═══════════════════════════════════════════════════════════════
  build-check:
    name: 📦 Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    needs: [frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ═══════════════════════════════════════════════════════════════
  # GATE: Todos los checks deben pasar para permitir merge
  # ═══════════════════════════════════════════════════════════════
  ci-gate:
    name: ✅ CI Gate (Required for merge)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-check]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "📊 Resultados de jobs:"
          echo "  Backend Tests: ${{ needs.backend-tests.result }}"
          echo "  Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "  Build Check: ${{ needs.build-check.result }}"
          echo ""

          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "❌ Backend tests fallaron. Merge bloqueado."
            exit 1
          fi

          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "❌ Frontend tests fallaron. Merge bloqueado."
            exit 1
          fi

          if [[ "${{ needs.build-check.result }}" != "success" ]]; then
            echo "❌ Build verification falló. Merge bloqueado."
            exit 1
          fi

          echo "✅ Todos los checks pasaron. Merge permitido."
