name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Pest)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_restaurant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, bcmath, intl, pdo_pgsql
          coverage: none
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      
      - name: Copy .env
        run: cp .env.example .env
      
      - name: Generate app key
        run: php artisan key:generate
      
      - name: Create test database
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE pos_restaurant_test;"
        env:
          PGPASSWORD: secret
      
      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pos_restaurant_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
      
      - name: Run Pest tests
        run: ./vendor/bin/pest --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pos_restaurant_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          APP_ENV: testing

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: cd frontend && npm ci
      
      - name: Build
        run: cd frontend && npm run build
      
      - name: Run tests
        run: cd frontend && npm test -- --run
